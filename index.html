<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCJWL Tournament Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, deleteDoc, doc, updateDoc, getDocs, setDoc, writeBatch, serverTimestamp, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBVZBDErgAnh1Eq73rQ10UNqcUNk2FMn0",
            authDomain: "pcjwl-bd3df.firebaseapp.com",
            projectId: "pcjwl-bd3df",
            storageBucket: "pcjwl-bd3df.firebasestorage.app",
            messagingSenderId: "647936171921",
            appId: "1:647936171921:web:6158bd4bad5c25973c0430"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const ADMIN_ROLES = {'1111': 'Admin 1A', '2222': 'Admin 1B', '3333': 'Admin 2A', '4444': 'Admin 2B', '1234': 'Master Admin'};
        const DIVISIONS = ["1A", "1B", "2A", "2B"];
        const DEFAULT_TEAMS = ["Franklin Pierce", "Mad Dogs", "Enumclaw", "Hoquiam", "Cruisers WC", "Auburn", "Olympia", "Tumwater", "Kent", "Rainier", "Orting", "Tahoma", "Sumner", "Gig Harbor", "University Place", "White River", "Puyallup", "Bethel", "JBLM", "Fife"];

        let currentUserRole = null; 
        let currentFilterDiv = "ALL";
        let wrestlers = [];
        let teamAssignments = {};

        window.login = (pin) => {
            const p = pin.trim();
            if (ADMIN_ROLES[p]) { 
                currentUserRole = ADMIN_ROLES[p]; 
                if(currentUserRole !== 'Master Admin') currentFilterDiv = currentUserRole.split(' ')[1];
                showApp(); 
            } else if (p.toUpperCase() === 'GUEST') { currentUserRole = 'public'; showApp(); }
            else { alert("Invalid PIN."); }
        };

        function showApp() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-content').classList.remove('hidden');
            if (currentUserRole === 'Master Admin') {
                document.getElementById('master-settings').classList.remove('hidden');
                document.getElementById('reset-container').classList.remove('hidden');
            }
            if (currentUserRole.includes('Admin')) {
                document.querySelectorAll('.admin-only').forEach(e => e.classList.remove('hidden'));
            }
            document.getElementById('role-display').innerText = currentUserRole;
            renderTeamAssignments();
        }

        // --- MASTER SEASON RESET ---
        window.seasonReset = async () => {
            if (!confirm("⚠️ DANGER: This will delete ALL wrestlers and ALL brackets for the entire league. This cannot be undone. Are you sure?")) return;
            
            const collectionsToClear = ['wrestlers', 'brackets'];
            for (const colName of collectionsToClear) {
                const snap = await getDocs(collection(db, colName));
                const batch = writeBatch(db);
                snap.forEach(d => batch.delete(d.ref));
                await batch.commit();
            }
            alert("Season Reset Complete. All rosters and brackets cleared.");
        };

        // --- TEAM CONFIG ---
        onSnapshot(collection(db, "teamConfig"), (snap) => {
            snap.forEach(d => { teamAssignments[d.id] = d.data().division; });
            setupTeamDropdowns();
            renderRoster();
        });

        window.updateTeamDivision = async (teamName, newDiv) => {
            await setDoc(doc(db, "teamConfig", teamName), { division: newDiv });
        };

        function renderTeamAssignments() {
            const list = document.getElementById('team-rotation-list');
            if(!list) return;
            list.innerHTML = DEFAULT_TEAMS.sort().map(team => `
                <div class="flex justify-between items-center p-2 border-b text-xs">
                    <span class="font-bold">${team}</span>
                    <select onchange="updateTeamDivision('${team}', this.value)" class="border rounded p-1">
                        ${DIVISIONS.map(d => `<option value="${d}" ${teamAssignments[team] === d ? 'selected' : ''}>${d}</option>`).join('')}
                    </select>
                </div>`).join('');
        }

        // --- WRESTLER & BRACKET CORE (Previous Logic) ---
        onSnapshot(collection(db, "wrestlers"), (snap) => {
            wrestlers = [];
            snap.forEach(d => wrestlers.push({ id: d.id, ...d.data() }));
            renderRoster();
        });

        window.addWrestler = async (e) => {
            e.preventDefault();
            const team = document.getElementById('team-select').value;
            await addDoc(collection(db, "wrestlers"), {
                firstName: document.getElementById('fname').value,
                lastName: document.getElementById('lname').value,
                team: team,
                division: teamAssignments[team] || "1A",
                ageGroup: document.getElementById('age-select').value,
                skill: document.getElementById('skill-select').value,
                weight: 0, weighedIn: false
            });
            e.target.reset();
        };

        window.renderRoster = () => {
            const list = document.getElementById('roster-list');
            const search = document.getElementById('roster-search').value.toLowerCase();
            const filtered = wrestlers.filter(w => (currentFilterDiv === "ALL" || w.division === currentFilterDiv) && `${w.firstName} ${w.lastName}`.toLowerCase().includes(search));
            list.innerHTML = filtered.map(w => `
                <div class="flex justify-between items-center p-2 border-b text-xs">
                    <div><b>${w.firstName} ${w.lastName}</b><br><span class="opacity-50">${w.team}</span></div>
                    <button onclick="markWeight('${w.id}')" class="px-2 py-1 rounded text-white font-bold ${w.weighedIn ? 'bg-green-600' : 'bg-red-500'}">
                        ${w.weighedIn ? w.weight : 'WEIGH'}
                    </button>
                </div>`).join('');
        };

        window.markWeight = async (id) => {
            const w = prompt("Weight:");
            if(w) await updateDoc(doc(db, "wrestlers", id), { weight: parseFloat(w), weighedIn: true, weighInTime: serverTimestamp() });
        };

        window.generateBrackets = async () => {
            const targetDiv = currentFilterDiv === "ALL" ? "1A" : currentFilterDiv;
            const ready = wrestlers.filter(w => w.weighedIn && w.division === targetDiv).sort((a,b) => a.weight - b.weight);
            const size = parseInt(document.getElementById('bracket-size').value);
            const diff = parseFloat(document.getElementById('max-diff').value);
            const batch = writeBatch(db);
            let current = [], bout = 100;

            ready.forEach((w) => {
                if (current.length === 0 || (w.weight - current[0].weight <= diff && current.length < size)) {
                    current.push(w);
                } else {
                    batch.set(doc(collection(db, "brackets")), { kids: current, division: targetDiv, bout: bout++, status: 'waiting', mat: (bout % 4) + 1 });
                    current = [w];
                }
            });
            if(current.length) batch.set(doc(collection(db, "brackets")), { kids: current, division: targetDiv, bout: bout++, status: 'waiting', mat: (bout % 4) + 1 });
            await batch.commit();
        };

        onSnapshot(collection(db, "brackets"), (snap) => {
            const out = document.getElementById('bracket-output'), data = [];
            snap.forEach(d => data.push({id: d.id, ...d.data()}));
            out.innerHTML = data.filter(b => currentFilterDiv === "ALL" || b.division === currentFilterDiv).map(b => `
                <div class="p-3 border-2 ${b.status === 'active' ? 'border-yellow-400 bg-yellow-50' : 'border-black bg-white'} mb-4 rounded shadow-sm">
                    <div class="flex justify-between items-center mb-2"><span class="text-[8px] font-black text-red-600 uppercase">Mat ${b.mat}</span><b class="text-xs">#${b.bout}</b></div>
                    ${b.kids.map(k => `<div class="flex justify-between text-[10px] py-0.5 border-b border-black/5"><span>${k.firstName} ${k.lastName}</span><b>${k.weight}</b></div>`).join('')}
                    <div class="mt-2 flex gap-1 admin-only ${currentUserRole.includes('Admin') ? '' : 'hidden'}">
                        <button onclick="updateBout('${b.id}', 'active')" class="bg-yellow-400 text-[8px] px-2 py-1 rounded">START</button>
                        <button onclick="updateBout('${b.id}', 'done')" class="bg-green-600 text-white text-[8px] px-2 py-1 rounded">FINISH</button>
                    </div>
                </div>`).join('');
        });

        window.updateBout = async (id, status) => await updateDoc(doc(db, "brackets", id), { status });
        window.setDivisionFilter = (val) => { currentFilterDiv = val; renderRoster(); };
        function setupTeamDropdowns() { document.getElementById('team-select').innerHTML = DEFAULT_TEAMS.sort().map(t => `<option value="${t}">${t}</option>`).join(''); }

    </script>
</head>
<body class="bg-slate-50">
    <div id="login-screen" class="flex flex-col items-center pt-24">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-72 text-center border-t-4 border-blue-900">
            <h1 class="text-2xl font-black text-blue-900 mb-6 italic uppercase">PCJWL</h1>
            <input type="password" id="pin" class="border p-2 w-full mb-4 text-center rounded" placeholder="PIN">
            <button onclick="login(document.getElementById('pin').value)" class="bg-blue-900 text-white w-full py-2 rounded font-bold uppercase">Login</button>
        </div>
    </div>

    <div id="app-content" class="hidden p-4 max-w-7xl mx-auto">
        <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm">
            <div>
                <h2 id="role-display" class="font-black text-blue-900 uppercase italic"></h2>
                <select id="div-filter" onchange="setDivisionFilter(this.value)" class="text-xs border rounded font-bold mt-2">
                    <option value="ALL">All Divisions</option>
                    <option value="1A">1A</option><option value="1B">1B</option>
                    <option value="2A">2A</option><option value="2B">2B</option>
                </select>
            </div>
            <div id="reset-container" class="hidden">
                <button onclick="seasonReset()" class="bg-red-600 text-white px-4 py-2 rounded-lg text-xs font-black uppercase tracking-widest shadow-lg">Reset Season</button>
            </div>
        </div>

        <div id="master-settings" class="hidden bg-white p-6 rounded-xl border border-blue-200 shadow-sm mb-8">
            <h3 class="text-xs font-black text-blue-900 uppercase mb-4 tracking-widest border-b pb-2">Season Team Rotation</h3>
            <div id="team-rotation-list" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-4 rounded-xl shadow-sm border">
                <form onsubmit="addWrestler(event)" class="space-y-2">
                    <div class="flex gap-2"><input id="fname" placeholder="First" class="border p-2 text-sm w-full rounded" required><input id="lname" placeholder="Last" class="border p-2 text-sm w-full rounded" required></div>
                    <select id="team-select" class="border p-2 text-sm w-full font-bold"></select>
                    <div class="grid grid-cols-2 gap-2">
                        <select id="age-select" class="border p-1 text-xs"><option>8 & Under Open</option><option>9 & Over Open</option><option>Female</option></select>
                        <select id="skill-select" class="border p-1 text-xs"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select>
                    </div>
                    <button type="submit" class="bg-blue-900 text-white w-full py-2 rounded font-bold text-xs uppercase">Add Wrestler</button>
                </form>
            </div>
            <div class="lg:col-span-2 bg-white p-4 rounded-xl shadow-sm border overflow-hidden">
                <input id="roster-search" onkeyup="renderRoster()" placeholder="Search Name..." class="border p-1 text-[10px] rounded w-full mb-2">
                <div id="roster-list" class="grid grid-cols-1 sm:grid-cols-2 gap-x-4 h-40 overflow-y-auto"></div>
            </div>
        </div>

        <div class="admin-only hidden bg-blue-900 p-4 rounded-xl mb-8 flex gap-4 items-center justify-center">
            <select id="bracket-size" class="p-1 rounded text-xs"><option value="4">4-Man</option><option value="5">5-Man</option></select>
            <input id="max-diff" value="5" type="number" class="p-1 rounded text-xs w-12">
            <button onclick="generateBrackets()" class="bg-yellow-400 text-blue-900 px-4 py-1 rounded font-black text-xs uppercase italic">Build Brackets</button>
        </div>

        <div id="bracket-output" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
    </div>
</body>
</html>
