<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCJWL Tournament Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, deleteDoc, doc, updateDoc, getDocs, setDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBVZBDErgAnh1Eq73rQ10UNqcUNk2FMn0",
            authDomain: "pcjwl-bd3df.firebaseapp.com",
            projectId: "pcjwl-bd3df",
            storageBucket: "pcjwl-bd3df.firebasestorage.app",
            messagingSenderId: "647936171921",
            appId: "1:647936171921:web:6158bd4bad5c25973c0430"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // Defined Admin Roles for each group
        const ADMIN_ROLES = {
            '1111': 'Admin 1A', 
            '2222': 'Admin 1B', 
            '3333': 'Admin 2A', 
            '4444': 'Admin 2B', 
            '1234': 'Master Admin',
            '5555': 'Coach' // New Coach Role for Import access
        };
        const DIVISIONS = ["1A", "1B", "2A", "2B"];
        const DEFAULT_TEAMS = ["Franklin Pierce", "Mad Dogs", "Enumclaw", "Hoquiam", "Cruisers WC", "Auburn", "Olympia", "Tumwater", "Kent", "Rainier", "Orting", "Tahoma", "Sumner", "Gig Harbor", "University Place", "White River", "Puyallup", "Bethel", "JBLM", "Fife"];

        let currentUserRole = null; 
        let currentFilterDiv = "ALL";
        let wrestlers = [];
        let teamAssignments = {};

        window.login = (pin) => {
            const p = pin.trim();
            if (ADMIN_ROLES[p]) { 
                currentUserRole = ADMIN_ROLES[p]; 
                // Auto-filter based on Group Admin role
                if(currentUserRole.includes('Admin') && currentUserRole !== 'Master Admin') {
                    currentFilterDiv = currentUserRole.split(' ')[1];
                }
                showApp(); 
            } else if (p.toUpperCase() === 'GUEST') { 
                currentUserRole = 'public'; 
                showApp(); 
            } else { alert("Access Denied."); }
        };

        function showApp() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-content').classList.remove('hidden');
            
            const isGuest = currentUserRole === 'public';
            const isMaster = currentUserRole === 'Master Admin';
            const isCoach = currentUserRole === 'Coach';

            if (isMaster) document.getElementById('master-tools').classList.remove('hidden');
            if (!isGuest) {
                document.getElementById('admin-dashboard').classList.remove('hidden');
                document.getElementById('import-section').classList.remove('hidden'); // Restore Import for Coaches/Admins
            }
            
            document.getElementById('role-display').innerText = isGuest ? "Guest Viewer" : currentUserRole;
            renderTeamAssignments();
        }

        // CSV Import Logic for Coaches
        window.importRoster = async () => {
            const fileInput = document.getElementById('csv-file');
            const file = fileInput.files[0];
            if (!file) return alert("Please select a CSV file.");

            const reader = new FileReader();
            reader.onload = async (e) => {
                const text = e.target.result;
                const rows = text.split('\n').slice(1); // Skip header
                const batch = writeBatch(db);

                rows.forEach(row => {
                    const [fname, lname, team, age, skill] = row.split(',');
                    if (fname && lname) {
                        const newDoc = doc(collection(db, "wrestlers"));
                        batch.set(newDoc, {
                            firstName: fname.trim(),
                            lastName: lname.trim(),
                            team: team.trim(),
                            division: teamAssignments[team.trim()] || "1A",
                            ageGroup: age.trim(),
                            skill: skill.trim(),
                            weight: 0,
                            weighedIn: false
                        });
                    }
                });
                await batch.commit();
                alert("Roster Imported Successfully!");
            };
            reader.readAsText(file);
        };

        // ... [Database listeners and other logic kept from previous version] ...

        onSnapshot(collection(db, "teamConfig"), (snap) => {
            snap.forEach(d => { teamAssignments[d.id] = d.data().division; });
            const ts = document.getElementById('team-select');
            if(ts) ts.innerHTML = DEFAULT_TEAMS.sort().map(t => `<option value="${t}">${t}</option>`).join('');
        });

        onSnapshot(collection(db, "wrestlers"), (snap) => {
            wrestlers = [];
            snap.forEach(d => wrestlers.push({ id: d.id, ...d.data() }));
            renderRoster();
        });

        onSnapshot(collection(db, "brackets"), (snap) => {
            const out = document.getElementById('bracket-output');
            const data = [];
            snap.forEach(d => data.push({id: d.id, ...d.data()}));
            out.innerHTML = data.filter(b => currentFilterDiv === "ALL" || b.division === currentFilterDiv).map(b => `
                <div class="bracket-card p-3 border-2 ${b.status === 'active' ? 'border-yellow-400 bg-yellow-50' : 'border-black bg-white'} mb-4 rounded shadow-sm transition-all duration-300">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-[8px] font-black text-red-600 uppercase">Mat ${b.mat} | ${b.division}</span>
                        <b class="text-xs">#${b.bout}</b>
                    </div>
                    <div class="text-[9px] font-bold text-blue-900 mb-1 uppercase">${b.ageGroup || ''} - ${b.skill || ''}</div>
                    ${b.kids.map(k => `<div class="flex justify-between text-[10px] py-1 border-b border-black/5"><span>${k.firstName} ${k.lastName}</span><b>${k.weight}</b></div>`).join('')}
                </div>`).join('');
        });

        window.addWrestler = async (e) => {
            e.preventDefault();
            const team = document.getElementById('team-select').value;
            await addDoc(collection(db, "wrestlers"), {
                firstName: document.getElementById('fname').value,
                lastName: document.getElementById('lname').value,
                team: team,
                division: teamAssignments[team] || "1A",
                ageGroup: document.getElementById('age-select').value,
                skill: document.getElementById('skill-select').value,
                weight: 0, weighedIn: false
            });
            e.target.reset();
        };

        function renderRoster() {
            const list = document.getElementById('roster-list');
            if(!list) return;
            const filtered = wrestlers.filter(w => (currentFilterDiv === "ALL" || w.division === currentFilterDiv));
            list.innerHTML = filtered.map(w => `<div class="text-[10px] p-1 border-b">${w.firstName} ${w.lastName} (${w.team}) - ${w.ageGroup}</div>`).join('');
        }

        function renderTeamAssignments() {
            const list = document.getElementById('team-rotation-list');
            if(!list) return;
            list.innerHTML = DEFAULT_TEAMS.sort().map(team => `
                <div class="flex justify-between items-center p-1 border-b text-[10px]">
                    <span>${team}</span>
                    <select onchange="updateTeamDivision('${team}', this.value)" class="border rounded px-1">
                        ${DIVISIONS.map(d => `<option value="${d}" ${teamAssignments[team] === d ? 'selected' : ''}>${d}</option>`).join('')}
                    </select>
                </div>`).join('');
        }

        window.updateTeamDivision = async (t, v) => await setDoc(doc(db, "teamConfig", t), { division: v });
    </script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="login-screen" class="flex flex-col items-center pt-24">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-80 text-center border-t-4 border-blue-900">
            <h1 class="text-2xl font-black text-blue-900 mb-2 italic uppercase tracking-tighter">PCJWL</h1>
            <button onclick="login('GUEST')" class="bg-blue-600 text-white w-full py-4 rounded-xl font-black uppercase text-sm shadow-lg mb-8 mt-4">View Live Brackets</button>
            <div class="relative mb-8"><hr><span class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white px-2 text-[10px] font-bold text-slate-300 italic">Admin/Coach Login</span></div>
            <input type="password" id="pin" class="border p-3 w-full text-center rounded-lg text-sm mb-2" placeholder="Enter PIN">
            <button onclick="login(document.getElementById('pin').value)" class="bg-slate-900 text-white w-full py-3 rounded-lg font-bold text-xs uppercase tracking-widest">Enter Portal</button>
        </div>
    </div>

    <div id="app-content" class="hidden p-4 max-w-7xl mx-auto">
        <div class="sticky top-0 z-50 bg-slate-50 pb-4">
            <div class="bg-blue-900 p-4 rounded-2xl shadow-xl flex flex-col md:flex-row gap-4 items-center">
                <input type="text" onkeyup="findMyWrestler(this.value)" placeholder="🔍 PARENTS: Find Wrestler Mat..." class="w-full p-4 rounded-xl text-sm font-bold">
                <div class="flex items-center gap-4 text-white">
                    <span id="role-display" class="font-black italic text-[10px] uppercase"></span>
                    <button onclick="location.reload()" class="bg-red-500 px-3 py-1 rounded text-[10px] font-bold">LOGOUT</button>
                </div>
            </div>
        </div>

        <div id="import-section" class="hidden bg-white p-4 rounded-xl border mb-6 flex flex-col sm:flex-row gap-4 items-center justify-between">
            <div class="text-xs font-bold uppercase text-slate-500">Coach: Bulk Import Roster (.csv)</div>
            <div class="flex gap-2">
                <input type="file" id="csv-file" accept=".csv" class="text-[10px] border p-1 rounded">
                <button onclick="importRoster()" class="bg-blue-900 text-white px-4 py-2 rounded font-bold text-[10px] uppercase">Import</button>
            </div>
        </div>

        <div id="admin-dashboard" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-4 mb-8">
            <div class="bg-white p-4 rounded-xl border">
                <form onsubmit="addWrestler(event)" class="space-y-2">
                    <input id="fname" placeholder="First Name" class="border p-2 text-sm w-full" required>
                    <input id="lname" placeholder="Last Name" class="border p-2 text-sm w-full" required>
                    <select id="team-select" class="border p-2 text-sm w-full font-bold bg-slate-50"></select>
                    <div class="grid grid-cols-2 gap-2">
                        <select id="age-select" class="border p-2 text-xs w-full"><option>8 & Under Open</option><option>9 & Over Open</option><option>Female</option></select>
                        <select id="skill-select" class="border p-2 text-xs w-full"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select>
                    </div>
                    <button type="submit" class="bg-blue-900 text-white w-full py-2 rounded font-bold uppercase text-xs italic tracking-widest">Register Athlete</button>
                </form>
            </div>
            <div class="lg:col-span-2 bg-white p-4 rounded-xl border h-56 overflow-y-auto" id="roster-list"></div>
        </div>

        <div id="master-tools" class="hidden bg-white p-4 rounded-xl border mb-8">
            <h3 class="text-xs font-black uppercase mb-4 border-b pb-2">Season Team-to-Division Rotation</h3>
            <div id="team-rotation-list" class="grid grid-cols-2 md:grid-cols-4 gap-2"></div>
        </div>

        <div id="bracket-output" class="flex flex-col sm:grid sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
    </div>
</body>
</html>
