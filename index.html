<script type="module">
    // ... [Previous initialization code remains the same] ...

    function renderRoster() {
        const list = document.getElementById('roster-list');
        const search = document.getElementById('roster-search').value.toLowerCase();
        const filtered = wrestlers.filter(w => {
            const matchName = `${w.firstName} ${w.lastName}`.toLowerCase().includes(search);
            const matchTeam = currentUserRole === 'admin' || currentUserRole === 'public' || w.team === currentUserRole;
            return matchName && matchTeam;
        });

        list.innerHTML = filtered.map(w => `
            <div class="flex justify-between items-center p-3 border-b ${w.weighedIn ? 'bg-green-50' : 'bg-white'} rounded-lg mb-1 shadow-sm">
                <div class="flex-1">
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-sm text-slate-800">${w.firstName} ${w.lastName}</span>
                        <span class="text-[8px] bg-slate-100 px-1 rounded font-black text-slate-500 uppercase">${w.skill}</span>
                    </div>
                    <div class="text-[9px] text-blue-900 font-bold uppercase mt-0.5">
                        ${w.team} <span class="text-gray-400 mx-1">|</span> ${w.ageGroup}
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="markWeighedIn('${w.id}')" class="px-4 py-2 rounded text-[10px] font-black text-white shadow-sm transition-all ${w.weighedIn ? 'bg-green-600' : 'bg-red-500 hover:bg-red-600'}">
                        ${w.weighedIn ? w.weight + ' LBS' : 'WEIGH'}
                    </button>
                    ${currentUserRole === 'admin' ? `<button onclick="deleteWrestler('${w.id}')" class="text-gray-300 hover:text-red-500 text-xs px-1">✕</button>` : ''}
                </div>
            </div>`).join('');
    }

    // Add this helper for Admin cleanup
    window.deleteWrestler = async (id) => {
        if(confirm("Delete this wrestler?")) {
            await deleteDoc(doc(db, "wrestlers", id));
        }
    };

    // ... [Rest of the helper functions remain the same] ...
</script>
